version: '3.8'

services:
  # Backend Microservice: FastAPI Inference Engine
  api:
    build: .
    container_name: hydropulse-api
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Microservice: Streamlit Dashboard Client
  ui:
    build: .
    container_name: hydropulse-ui
    ports:
      - "8501:8501"
    command: streamlit run apps/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
